MCU_MODEL = STM32H743VITx
CHIBIOS_VERSION = 3.0

HEADER
/*
 * Board file for the Holybro Kakute H743-Wing flight controller.
 * Pin map cross-checked against ArduPilot hwdef KakuteH7-Wing.
 *
 * Sensors:
 *   IMU1 BMI088   on SPI1 (accel CS PC8, gyro CS PC9, DRDY PD11/PD10)
 *   IMU2 ICM42688 on SPI3 (CS PE12, DRDY PE15)
 *   OSD  AT7456E  on SPI2 (CS PB12)
 *   Baro BMP280/SPL06 on I2C
 */
#pragma once

/*
 * Board identifier.
 */
#define BOARD_HOLYBRO_KAKUTE_H743_WING
#define BOARD_NAME                  "Holybro Kakute H743-Wing"

/*
 * Board oscillators-related settings.
 * Kakute H743-Wing uses a 16 MHz HSE crystal.
 */
#if !defined(STM32_LSECLK)
#define STM32_LSECLK                32768U
#endif

#define STM32_LSEDRV                (3U << 3U)

#if !defined(STM32_HSECLK)
#define STM32_HSECLK                16000000U
#endif

/*
 * MCU type as defined in the ST header.
 */
#define STM32H743xx

/* allow to define ADC_CHANNEL_VSUPPLY in the airframe file*/
#ifndef ADC_CHANNEL_VSUPPLY
#define ADC_CHANNEL_VSUPPLY ADC_1
#endif

/* Battery sensing scaling (16-bit ADC). Main Vbat scale 18.18 and current
 * scale 36.6 A/V are the ArduPilot KakuteH7-Wing defaults; calibrate per
 * power module. (Secondary Vbat2 scale is 11.0.) */
#define DefaultVoltageOfAdc(adc) ((3.3f/65536.0f) * 18.18f * adc)
#define DefaultMilliAmpereOfAdc(adc) ((3.3f/65536.0f) * 36.6f  * adc)

/* Battery monitoring for file closing */
#define SDLOG_BAT_ADC ADCD1
#define SDLOG_BAT_CHAN AD1_1_CHANNEL

/*
 * PWM TIM defines (14 PWM outputs over TIM1/2/3/4/5/15)
 */
#ifndef USE_PWM_TIM1
#define USE_PWM_TIM1 1
#endif
#ifndef USE_PWM_TIM2
#define USE_PWM_TIM2 1
#endif
#ifndef USE_PWM_TIM3
#define USE_PWM_TIM3 1
#endif
#ifndef USE_PWM_TIM4
#define USE_PWM_TIM4 1
#endif
#ifndef USE_PWM_TIM5
#define USE_PWM_TIM5 1
#endif
#ifndef USE_PWM_TIM15
#define USE_PWM_TIM15 1
#endif

CONFIG


# PIN NAME PERIPH_TYPE AF_NUMBER or
# PIN NAME FUNCTION PP_or_OPENDRAIN PIN_SPEED PULL_RESISTOR INITIAL_LEVEL AF_NUMBER
# SPEED : SPEED_VERYLOW, SPEED_LOW, SPEED_MEDIUM, SPEED_HIGH
#
# 'SYS' => ['ALTERNATE', 'PUSHPULL', 'SPEED_HIGH', 'FLOATING', 'LEVEL_HIGH'],
# 'ADC' => ['ANALOG', 'PUSHPULL', 'SPEED_HIGH', 'FLOATING', 'LEVEL_LOW'],
# 'PWM' => ['ALTERNATE', 'PUSHPULL', 'SPEED_HIGH', 'FLOATING', 'LEVEL_LOW'],
# 'I2C' => ['ALTERNATE', 'OPENDRAIN', 'SPEED_HIGH', 'PULLUP', 'LEVEL_HIGH'],
# 'SPI' => ['ALTERNATE', 'PUSHPULL', 'SPEED_HIGH', 'FLOATING', 'LEVEL_HIGH'],
# 'UART' => ['ALTERNATE', 'PUSHPULL', 'SPEED_HIGH', 'PULLUP', 'LEVEL_HIGH'],
# 'OTG' => ['ALTERNATE', 'PUSHPULL', 'SPEED_HIGH', 'FLOATING', 'LEVEL_HIGH'],
# 'SDIO' => ['ALTERNATE', 'PUSHPULL', 'SPEED_HIGH', 'PULLUP', 'LEVEL_HIGH'],
# 'CAN' => ['ALTERNATE', 'PUSHPULL', 'SPEED_HIGH', 'FLOATING', 'LEVEL_HIGH'],
# 'LED' => ['OUTPUT', 'PUSHPULL', 'SPEED_VERYLOW', 'FLOATING', 'LEVEL_LOW'],
# 'PASSIVE' => ['INPUT', 'PUSHPULL', 'SPEED_VERYLOW', 'FLOATING', 'LEVEL_LOW']);
#
# SYSTEM
A13     SWDIO     SYS  AF:DEBUG_JTMS-SWDIO
A14     SWCLK     SYS  AF:DEBUG_JTCK-SWCLK
H00     OSC_IN    SYS  AF0
H01     OSC_OUT   SYS  AF0

# DEFAULT
DEFAULT                 INPUT   PUSHPULL SPEED_VERYLOW PULLDOWN LEVEL_LOW  AF0

# ACTIVE PINS
PA00    SERVO7              PWM     AF:TIM5_CH1 ()  # M7
PA01    SERVO8              PWM     AF:TIM5_CH2 ()  # M8
PA02    ADC4                ADC     ADC1_INP14 () # Curr2 (BATT2 current 0-3.3V)
PA03    ADC3                ADC     ADC1_INP15 () # Vbat2 (BATT2 voltage 10-36V)
PA04    ADC6                ADC     ADC1_INP18 () # 5V rail sense
PA05    SPI1_SCK            SPI     AF:SPI1_SCK   # IMU1 BMI088
PA06    SPI1_MISO           SPI     AF:SPI1_MISO  # IMU1 BMI088
PA07    SPI1_MOSI           SPI     AF:SPI1_MOSI  # IMU1 BMI088
PA08    SERVO1              PWM     AF:TIM1_CH1 ()  # M1
PA09    USB_VBUS            INPUT   # VBUS_VALID
PA10    UART1_RX            UART    AF:USART1_RX
PA11    USB_DM              OTG     AF:USB_OTG_FS_DM
PA12    USB_DP              OTG     AF:USB_OTG_FS_DP
PA15    SERVO14             PWM     AF:TIM2_CH1 ()  # M14

PB00    SERVO12             PWM     AF:TIM3_CH3 ()  # M12
PB01    SERVO13             PWM     AF:TIM3_CH4 ()  # M13
PB02    VDD_3V3_SENSORS_EN  OUTPUT  PUSHPULL SPEED_VERYLOW FLOATING LEVEL_HIGH # sensor rail enable
PB03    SDMMC2_D2           SDIO    AF:SDMMC2_D2
PB04    SDMMC2_D3           SDIO    AF:SDMMC2_D3
PB05    SERVO11             PWM     AF:TIM3_CH2 ()  # M11
PB06    UART1_TX            UART    AF:USART1_TX
PB07    I2C1_SDA            I2C     AF:I2C1_SDA
PB08    I2C1_SCL            I2C     AF:I2C1_SCL
PB09    BUZZER              OUTPUT  PUSHPULL SPEED_VERYLOW FLOATING LEVEL_LOW
PB10    I2C2_SCL            I2C     AF:I2C2_SCL
PB11    I2C2_SDA            I2C     AF:I2C2_SDA
PB12    SPI_SLAVE3          OUTPUT  PUSHPULL SPEED_HIGH FLOATING LEVEL_HIGH # AT7456E/MAX7456 OSD CS
# NOTE: UART5 TX (PB13, AF14) and RX (PD2, AF8) use *different* alternate
# functions. The generic chibios UART driver applies one AF to both pins, so
# UART5 cannot drive RX and TX correctly at once; use it TX-only or avoid it.
PB13    UART5_TX            UART    AF:UART5_TX
PB14    SDMMC2_D0           SDIO    AF:SDMMC2_D0
PB15    SDMMC2_D1           SDIO    AF:SDMMC2_D1

PC00    ADC5                ADC     ADC1_INP10 () # RSSI (RSI pad) 0-3.3V
PC01    SDMMC2_CK           SDIOCK  AF:SDMMC2_CK
PC02    SPI2_MISO           SPI     AF:SPI2_MISO  # OSD
PC03    SPI2_MOSI           SPI     AF:SPI2_MOSI  # OSD
PC04    ADC2                ADC     ADC1_INP4 () # Curr (BATT current 0-3.3V)
PC05    ADC1                ADC     ADC1_INP8 () # Vbat (BATT voltage)
PC06    UART6_TX            UART    AF:USART6_TX
PC07    UART6_RX            UART    AF:USART6_RX  # SBUS/RC in
PC08    SPI_SLAVE0          OUTPUT  PUSHPULL SPEED_HIGH FLOATING LEVEL_HIGH # BMI088 accel CS
PC09    SPI_SLAVE1          OUTPUT  PUSHPULL SPEED_HIGH FLOATING LEVEL_HIGH # BMI088 gyro CS
PC10    SPI3_SCK            SPI     AF:SPI3_SCK   # IMU2 ICM42688
PC11    SPI3_MISO           SPI     AF:SPI3_MISO  # IMU2 ICM42688
PC12    SPI3_MOSI           SPI     AF:SPI3_MOSI  # IMU2 ICM42688
PC13    CAM_SELECT          OUTPUT  PUSHPULL SPEED_VERYLOW FLOATING LEVEL_LOW # FPV camera 1/2 select (ArduPilot GPIO 81)
PC14    LED2                LED     # status LED 2 (active low)
PC15    LED1                LED     # status LED 1 (active low)

PD00    CAN1_RX             CAN     AF:FDCAN1_RX  # DroneCAN / Radxa Q6A
PD01    CAN1_TX             CAN     AF:FDCAN1_TX  # DroneCAN / Radxa Q6A
PD02    UART5_RX            UART    AF:UART5_RX
PD03    SPI2_SCK            SPI     AF:SPI2_SCK   # OSD
PD04    IO1                 OUTPUT  PUSHPULL SPEED_VERYLOW FLOATING LEVEL_LOW # IO1 pad / user GPIO (ArduPilot GPIO 83)
PD05    UART2_TX            UART    AF:USART2_TX  # GPS
PD06    UART2_RX            UART    AF:USART2_RX  # GPS
PD07    SDMMC2_CMD          SDIO    AF:SDMMC2_CMD
PD08    UART3_TX            UART    AF:USART3_TX
PD09    UART3_RX            UART    AF:USART3_RX
PD10    DRDY_BMI088_GYRO    INPUT
PD11    DRDY_BMI088_ACC     INPUT
PD12    I2C4_SCL            I2C     AF:I2C4_SCL   # onboard baro
PD13    I2C4_SDA            I2C     AF:I2C4_SDA   # onboard baro
PD14    SERVO5              PWM     AF:TIM4_CH3 ()  # M5
PD15    SERVO6              PWM     AF:TIM4_CH4 ()  # M6

PE00    UART8_RX            UART    AF:UART8_RX
PE01    UART8_TX            UART    AF:UART8_TX
PE02    VDD_BRICK_nVALID    INPUT
PE03    VTX_9V_EN           OUTPUT  PUSHPULL SPEED_VERYLOW FLOATING LEVEL_HIGH # 9V VTX BEC enable, default ON (ArduPilot GPIO 82)
PE04    IO2                 OUTPUT  PUSHPULL SPEED_VERYLOW FLOATING LEVEL_LOW # IO2 pad / user GPIO (ArduPilot GPIO 84)
PE05    SERVO9              PWM     AF:TIM15_CH1 ()  # M9
PE06    SERVO10             PWM     AF:TIM15_CH2 ()  # M10
PE07    UART7_RX            UART    AF:UART7_RX
PE08    UART7_TX            UART    AF:UART7_TX
PE09    UART7_RTS           PASSIVE
PE10    UART7_CTS           PASSIVE
PE11    SERVO2              PWM     AF:TIM1_CH2 ()  # M2
PE12    SPI_SLAVE2          OUTPUT  PUSHPULL SPEED_HIGH FLOATING LEVEL_HIGH # ICM42688 CS
PE13    SERVO3              PWM     AF:TIM1_CH3 ()  # M3
PE14    SERVO4              PWM     AF:TIM1_CH4 ()  # M4
PE15    DRDY_ICM42688       INPUT

# GROUPS
GROUP   ENERGY_SAVE_INPUTS  %NAME=~/^SERVO[0-9]+|LED[0-9]+|SPI_SLAVE[0-9]+$/
GROUP   ENERGY_SAVE_LOWS    %NAME=~/^BUZZER$/
